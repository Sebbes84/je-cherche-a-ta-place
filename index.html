<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Je cherche à ta place 🔍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <!-- ══════════════════════════════════════════════════════════
       STYLES COMMUNS + PAGE CRÉATEUR
  ══════════════════════════════════════════════════════════ -->
  <style id="creator-styles">
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --card: #161a24; --border: #2a2f3e;
      --accent: #4f8aff; --accent2: #a259ff; --text: #e8eaf0;
      --muted: #7a80a0; --success: #34d399; --radius: 16px;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(79,138,255,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(162,89,255,0.1) 0%, transparent 70%);
    }
    /* ── Creator UI ── */
    #creator { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .logo { font-size: 3rem; margin-bottom: 0.5rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-align: center; margin-bottom: 0.5rem;
    }
    .subtitle { color: var(--muted); text-align: center; font-size: 1rem; margin-bottom: 2.5rem; line-height: 1.6; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 2rem; width: 100%; max-width: 600px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    #creator label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; }
    #creator input[type="text"] {
      width: 100%; padding: 1rem 1.2rem; background: #1e2235;
      border: 1.5px solid var(--border); border-radius: 12px; color: var(--text);
      font-size: 1.05rem; font-family: 'Inter', sans-serif; outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    #creator input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,138,255,0.15); }
    #creator input[type="text"]::placeholder { color: #3a4060; }
    .options { display: flex; gap: 1rem; margin-top: 1.2rem; flex-wrap: wrap; }
    .option-group { flex: 1; min-width: 130px; }
    #creator select {
      width: 100%; padding: 0.7rem 1rem; background: #1e2235;
      border: 1.5px solid var(--border); border-radius: 10px; color: var(--text);
      font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none; cursor: pointer;
      transition: border-color 0.25s;
    }
    #creator select:focus { border-color: var(--accent); }
    .btn-generate {
      width: 100%; margin-top: 1.5rem; padding: 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 12px; color: #fff; font-size: 1.05rem; font-weight: 700;
      font-family: 'Inter', sans-serif; cursor: pointer; transition: transform 0.15s, box-shadow 0.25s;
      box-shadow: 0 4px 20px rgba(79,138,255,0.3);
    }
    .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,138,255,0.45); }
    .btn-generate:active { transform: translateY(0); }

    /* ── Results ── */
    .results { display: none; margin-top: 1.5rem; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .result-block { padding: 1.2rem; border-radius: 12px; margin-bottom: 1rem; }
    .result-block:last-child { margin-bottom: 0; }
    .result-block.classic { background: #1a2030; border: 1px solid rgba(79,138,255,0.3); }
    .result-block.selfcontained { background: #1c1a2a; border: 1px solid rgba(162,89,255,0.3); }
    .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
    .result-title { font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .result-block.classic .result-title { color: var(--accent); }
    .result-block.selfcontained .result-title { color: var(--accent2); }
    .result-badge { font-size: 0.72rem; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: 600; }
    .badge-classic { background: rgba(79,138,255,0.12); color: var(--accent); border: 1px solid rgba(79,138,255,0.3); }
    .badge-self { background: rgba(162,89,255,0.12); color: var(--accent2); border: 1px solid rgba(162,89,255,0.3); }
    .result-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.8rem; line-height: 1.5; }
    .link-row { display: flex; align-items: center; gap: 0.7rem; }
    .link-display {
      flex: 1; font-size: 0.8rem; word-break: break-all; font-family: monospace;
      background: #111520; padding: 0.55rem 0.8rem; border-radius: 8px;
      border: 1px solid var(--border); max-height: 3.5rem; overflow-y: auto;
    }
    .result-block.classic .link-display { color: var(--accent); }
    .result-block.selfcontained .link-display { color: var(--accent2); }
    .btn-action {
      padding: 0.5rem 0.9rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer; white-space: nowrap;
      transition: background 0.2s; border: 1px solid;
    }
    .btn-classic { background: rgba(79,138,255,0.15); border-color: rgba(79,138,255,0.4); color: var(--accent); }
    .btn-classic:hover { background: rgba(79,138,255,0.28); }
    .btn-self { background: rgba(162,89,255,0.15); border-color: rgba(162,89,255,0.4); color: var(--accent2); }
    .btn-self:hover { background: rgba(162,89,255,0.28); }
    .btn-action.copied { color: var(--success) !important; border-color: rgba(52,211,153,0.4) !important; background: rgba(52,211,153,0.1) !important; }
    .row-btns { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
    .btn-open {
      flex: 1; padding: 0.65rem; border-radius: 10px; font-size: 0.88rem; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer; text-align: center;
      text-decoration: none; transition: background 0.2s; border: 1px solid; display: block;
    }
    .btn-open.o-classic { background: rgba(79,138,255,0.1); border-color: rgba(79,138,255,0.3); color: var(--accent); }
    .btn-open.o-classic:hover { background: rgba(79,138,255,0.2); }
    .btn-open.o-self { background: rgba(162,89,255,0.1); border-color: rgba(162,89,255,0.3); color: var(--accent2); }
    .btn-open.o-self:hover { background: rgba(162,89,255,0.2); }
    .footer { margin-top: 2rem; color: var(--muted); font-size: 0.8rem; text-align: center; opacity: 0.6; }

    /* ── Simulation UI (Google-like) ── */
    #simulation { display: none; font-family: Arial, sans-serif; width: 100%; flex-direction: column; align-items: center; }
    #simulation body, #simulation { background: #fff; color: #202124; }
    .g-header { width: 100%; padding: 1rem 1.5rem; display: flex; justify-content: flex-end; gap: 1rem; align-items: center; border-bottom: 1px solid #f0f0f0; }
    .g-header a { color: #202124; font-size: .85rem; text-decoration: none; }
    .g-header-btn { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: .45rem 1rem; font-size: .85rem; cursor: pointer; }
    .g-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1rem 8rem; width: 100%; min-height: 70vh; }
    .g-logo { font-size: 5.5rem; font-weight: 700; letter-spacing: -4px; margin-bottom: 1.8rem; user-select: none; }
    .g-logo span:nth-child(1){color:#4285F4}.g-logo span:nth-child(2){color:#EA4335}
    .g-logo span:nth-child(3){color:#FBBC05}.g-logo span:nth-child(4){color:#4285F4}
    .g-logo span:nth-child(5){color:#34A853}.g-logo span:nth-child(6){color:#EA4335}
    .g-search-container { position: relative; width: 100%; max-width: 582px; }
    .g-search-bar { width: 100%; display: flex; align-items: center; border: 1px solid #dfe1e5; border-radius: 24px; padding: .55rem 1rem .55rem 1.2rem; font-size: 1rem; background: #fff; transition: box-shadow .2s, border-color .2s; gap: .7rem; }
    .g-search-bar.focused { box-shadow: 0 1px 6px rgba(32,33,36,.28); border-color: rgba(223,225,229,0); }
    .g-search-icon { color: #9aa0a6; flex-shrink: 0; }
    .g-search-input { flex: 1; border: none; outline: none; font-size: 1rem; font-family: Arial,sans-serif; color: #202124; background: transparent; min-width: 0; }
    .g-mic-icon { color: #4285F4; flex-shrink: 0; }
    .g-search-buttons { display: flex; justify-content: center; gap: .8rem; margin-top: 1.5rem; }
    .g-search-btn { background: #f8f9fa; color: #3c4043; border: 1px solid #f8f9fa; border-radius: 4px; padding: .55rem 1.1rem; font-size: .9rem; cursor: pointer; font-family: Arial,sans-serif; transition: background .15s, border-color .15s, box-shadow .15s; }
    .g-search-btn.active { background: #e8eaed; }
    .g-footer { width: 100%; border-top: 1px solid #f0f0f0; padding: .9rem 2rem; display: flex; justify-content: space-between; font-size: .85rem; color: #70757a; }
    .g-footer a { color: #70757a; text-decoration: none; margin: 0 .6rem; }
    #cursor { position: fixed; width: 22px; height: 22px; border: 2.5px solid #333; border-radius: 50%; background: rgba(79,138,255,.25); pointer-events: none; transform: translate(-50%,-50%); transition: width .12s, height .12s, background .12s; z-index: 9999; box-shadow: 0 2px 8px rgba(0,0,0,.25); display: none; }
    #cursor.clicking { width: 14px; height: 14px; background: rgba(79,138,255,.55); }
    /* ── Simulation: reset input to white ── */
    #simulation input, #simulation .g-search-input {
      background: #fff !important;
      color: #202124 !important;
      border: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       PAGE CRÉATEUR
  ══════════════════════════════════════════════════════════ -->
  <div id="creator">
    <div class="logo">🔍</div>
    <h1>Je cherche à ta place</h1>
    <p class="subtitle">Génère un lien magique : quand on l'ouvre, Google<br>se lance et tape ta recherche tout seul !</p>

    <div class="card">
      <label for="query">Ta recherche</label>
      <input type="text" id="query" placeholder="Ex : recette tarte aux pommes…" autocomplete="off" />

      <div class="options">
        <div class="option-group">
          <label for="speed">Vitesse</label>
          <select id="speed">
            <option value="80">Rapide</option>
            <option value="130" selected>Normal</option>
            <option value="200">Lent</option>
          </select>
        </div>
        <div class="option-group">
          <label for="typos">Corrections</label>
          <select id="typos">
            <option value="0">Aucune</option>
            <option value="1" selected>Quelques-unes</option>
            <option value="2">Beaucoup</option>
          </select>
        </div>
        <div class="option-group">
          <label for="fautes">Fautes</label>
          <select id="fautes">
            <option value="0" selected>Aucune</option>
            <option value="1">Légères</option>
            <option value="2">Importantes</option>
          </select>
        </div>
        <div class="option-group">
          <label for="shorten">Lien</label>
          <select id="shorten">
            <option value="0">Direct</option>
            <option value="1" selected>Raccourci</option>
          </select>
        </div>
      </div>

      <button class="btn-generate" onclick="generateLinks()">✨ Générer le lien</button>

      <div class="results" id="results">
          <div class="result-block classic">
            <div class="link-row">
              <div class="link-display" id="linkClassic"></div>
              <button class="btn-action btn-classic" id="btnCopyClassic" onclick="copyLink()">Copier</button>
            </div>
            <div class="row-btns">
              <a class="btn-open o-classic" id="btnOpenClassic" target="_blank">↗ Ouvrir</a>
              <a class="btn-open o-self" id="btnIsgd" target="_blank" style="display:none">🔗 Raccourcir sur is.gd</a>
            </div>
          </div>
      </div>
    </div>
    <p class="footer">Génère un lien — partage-le à qui tu veux 🎩</p>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       PAGE SIMULATION (Google-like)
  ══════════════════════════════════════════════════════════ -->
  <div id="simulation">
    <div class="g-header">
      <a href="#">Gmail</a><a href="#">Images</a>
      <a href="#" style="font-size:1.4rem">⋮</a>
      <button class="g-header-btn">Connexion</button>
    </div>
    <div class="g-center">
      <div class="g-logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
      <div class="g-search-container">
        <div class="g-search-bar" id="searchBar">
          <svg class="g-search-icon" width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input class="g-search-input" type="text" id="searchInput" autocomplete="off" readonly />
          <svg class="g-mic-icon" width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </div>
        <div class="g-search-buttons">
          <button class="g-search-btn" id="btnGoogleSearch">Recherche Google</button>
          <button class="g-search-btn" id="btnLucky">J'ai de la chance</button>
        </div>
      </div>
    </div>
    <div class="g-footer">
      <div><a href="#">France</a></div>
      <div><a href="#">Publicité</a><a href="#">Business</a><a href="#">Recherche</a><a href="#">Confidentialité</a><a href="#">Conditions</a></div>
    </div>
  </div>

  <!-- Cursor overlay -->
  <div id="cursor"></div>

  <script>
  // ══════════════════════════════════════════════════════════════════
  //  ROUTER : Creator vs Simulation
  // ══════════════════════════════════════════════════════════════════
  const urlParams = new URLSearchParams(window.location.search);
  const MODE_SIM = urlParams.has('q');

  if (MODE_SIM) {
    // ── SIMULATION MODE ──────────────────────────────────────────────
    document.getElementById('creator').style.display = 'none';
    document.getElementById('simulation').style.display = 'flex';
    document.getElementById('simulation').style.flexDirection = 'column';
    document.getElementById('simulation').style.alignItems = 'center';
    document.getElementById('simulation').style.width = '100%';
    document.getElementById('cursor').style.display = 'block';
    document.body.style.background = '#fff';
    document.body.style.backgroundImage = 'none';
    document.body.style.padding = '0';
    document.body.style.justifyContent = 'flex-start';
    document.title = 'Google';

    runSimulation(
      urlParams.get('q'),
      parseInt(urlParams.get('speed') || '130'),
      parseInt(urlParams.get('typos') || '1'),
      parseInt(urlParams.get('fautes') || '0')
    );

  } else {
    // ── CREATOR MODE ─────────────────────────────────────────────────
    document.getElementById('simulation').style.display = 'none';
    document.getElementById('cursor').style.display = 'none';
  }

  // ══════════════════════════════════════════════════════════════════
  //  CREATOR LOGIC
  // ══════════════════════════════════════════════════════════════════
  let urlClassic = '', simParams = null;

  async function generateLinks() {
    const query = document.getElementById('query').value.trim();
    if (!query) {
      const inp = document.getElementById('query');
      inp.focus(); inp.style.borderColor = '#ff6b6b';
      setTimeout(() => inp.style.borderColor = '', 1000); return;
    }
    const speed   = parseInt(document.getElementById('speed').value);
    const typos   = parseInt(document.getElementById('typos').value);
    const fautes  = parseInt(document.getElementById('fautes').value);
    const shorten = parseInt(document.getElementById('shorten').value);
    simParams = { query, speed, typos, fautes };

    const GITHUB_BASE = 'https://sebbes84.github.io/je-cherche-a-ta-place/';
    const p = new URLSearchParams({ q: query, speed, typos, fautes });
    const longUrl = GITHUB_BASE + '?' + p.toString();
    urlClassic = longUrl;

    const linkDisplay = document.getElementById('linkClassic');
    const btnOpen     = document.getElementById('btnOpenClassic');
    const btnCopy     = document.getElementById('btnCopyClassic');
    btnOpen.href = longUrl;
    btnCopy.disabled = true;
    document.getElementById('results').style.display = 'block';

    // Affichage du lien
    linkDisplay.textContent = longUrl;
    urlClassic = longUrl;

    // Bouton is.gd : visible uniquement si Raccourci sélectionné
    const btnIsgd = document.getElementById('btnIsgd');
    if (shorten === 1) {
      btnIsgd.href = 'https://is.gd/create.php?url=' + encodeURIComponent(longUrl);
      btnIsgd.style.display = 'block';
    } else {
      btnIsgd.style.display = 'none';
    }

    btnCopy.disabled = false;
    btnCopy.textContent = 'Copier'; btnCopy.classList.remove('copied');
  }

  function copyLink() {
    navigator.clipboard.writeText(urlClassic).then(() => {
      const btn = document.getElementById('btnCopyClassic');
      btn.textContent = '✓ Copié !'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copier'; btn.classList.remove('copied'); }, 2500);
    });
  }

  function openPreview() {
    if (!simParams) return;
    // Aperçu local dans un nouvel onglet
    const p = new URLSearchParams({ q: simParams.query, speed: simParams.speed, typos: simParams.typos, fautes: simParams.fautes });
    const localUrl = window.location.href.split('?')[0] + '?' + p.toString();
    window.open(localUrl, '_blank');
  }

  document.getElementById('query').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') generateLinks();
  });

  // ══════════════════════════════════════════════════════════════════
  //  SIMULATION LOGIC
  // ══════════════════════════════════════════════════════════════════
  async function runSimulation(TARGET, SPEED, TYPOS, FAUTES) {
    const cursor    = document.getElementById('cursor');
    const searchBar = document.getElementById('searchBar');
    const searchInp = document.getElementById('searchInput');
    const btnSearch = document.getElementById('btnGoogleSearch');

    let curX = window.innerWidth / 2, curY = window.innerHeight / 2;
    cursor.style.left = curX + 'px'; cursor.style.top = curY + 'px';

    function moveTo(x, y, dur) {
      return new Promise(resolve => {
        const sx = curX, sy = curY, st = performance.now();
        function step(now) {
          const t = Math.min((now - st) / dur, 1), e = t < 0.5 ? 2*t*t : -1 + (4-2*t)*t;
          curX = sx + (x - sx) * e; curY = sy + (y - sy) * e;
          cursor.style.left = curX + 'px'; cursor.style.top = curY + 'px';
          if (t < 1) requestAnimationFrame(step); else resolve();
        }
        requestAnimationFrame(step);
      });
    }

    function clk(el) {
      return new Promise(resolve => {
        cursor.classList.add('clicking');
        el && el.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
        setTimeout(() => {
          cursor.classList.remove('clicking');
          el && el.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
          el && el.click();
          resolve();
        }, 180);
      });
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ── Typo engine (corrections) ──
    const neighbors = {
      a:'qzsw',b:'vghn',c:'xdfv',d:'serf',e:'zsdr',f:'drtg',g:'ftyh',h:'gyuj',
      i:'ujko',j:'huik',k:'ijlo',l:'kopm',m:'nj,',n:'bhjm',o:'ikpl',p:'ol;',
      q:'asw',r:'edft',s:'aqwdez',t:'rfgy',u:'yhji',v:'cfgb',w:'qase',
      x:'zscd',y:'tghu',z:'aeqs',' ':'  '
    };
    function maybeTypo(ch) {
      if (!TYPOS) return null;
      const prob = TYPOS === 1 ? 0.07 : 0.18;
      if (Math.random() > prob) return null;
      const nb = neighbors[ch.toLowerCase()];
      if (!nb) return null;
      return nb[Math.floor(Math.random() * nb.length)];
    }

    // ── Fautes engine (visual only) ──
    const genderSwaps = [
      [/\bune\b/gi,'un'],[/\bun\b/gi,'une'],[/\bdes\b/gi,'de'],[/\bde\b/gi,'des'],
      [/\bces\b/gi,'ce'],[/\bce\b/gi,'ces'],[/\bles\b/gi,'le'],[/\ble\b/gi,'les'],
      [/\bla\b/gi,'le'],[/\bmon\b/gi,'ma'],[/\bma\b/gi,'mon'],[/\bton\b/gi,'ta'],[/\bta\b/gi,'ton']
    ];
    function applyFautes(text) {
      if (!FAUTES) return text;
      const pw = FAUTES === 1 ? 0.25 : 0.5, pg = FAUTES === 1 ? 0.15 : 0.35;
      let result = text;
      if (Math.random() < pg) {
        const cands = genderSwaps.filter(p => p[0].test(result));
        if (cands.length) {
          const pick = cands[Math.floor(Math.random() * cands.length)];
          result = result.replace(pick[0], m => m[0] === m[0].toUpperCase() ? pick[1][0].toUpperCase() + pick[1].slice(1) : pick[1]);
          pick[0].lastIndex = 0;
        }
      }
      return result.split(' ').map(w => {
        if (w.length < 3 || Math.random() > pw) return w;
        const t = Math.floor(Math.random() * 3);
        if (t === 0) { const p = 1 + Math.floor(Math.random() * (w.length - 2)); return w.slice(0,p) + w.slice(p+1); }
        else if (t === 1) { const p = Math.floor(Math.random() * (w.length-1)); return w.slice(0,p) + w[p+1] + w[p] + w.slice(p+2); }
        else { if (w.endsWith('s') && w.length > 3) return w.slice(0,-1); return w+'s'; }
      }).join(' ');
    }

    // ── Animation ──
    await sleep(600);

    const rect = searchBar.getBoundingClientRect();
    await moveTo(rect.left + rect.width * 0.4, rect.top + rect.height / 2, 900);
    await sleep(200);

    searchBar.classList.add('focused');
    await clk(searchInp);
    await sleep(350);

    const DISPLAY = applyFautes(TARGET);
    let typed = '';
    for (let i = 0; i < DISPLAY.length; i++) {
      const ch = DISPLAY[i], typo = maybeTypo(ch);
      if (typo) {
        typed += typo; searchInp.value = typed;
        await sleep(SPEED * (0.8 + Math.random() * 0.4));
        await sleep(SPEED * (1.5 + Math.random()));
        typed = typed.slice(0, -1); searchInp.value = typed;
        await sleep(SPEED * (0.6 + Math.random() * 0.4));
      }
      typed += ch; searchInp.value = typed;
      await sleep(SPEED * (0.7 + Math.random() * 0.6));
    }

    await sleep(400 + Math.random() * 300);

    const br = btnSearch.getBoundingClientRect();
    await moveTo(br.left + br.width / 2, br.top + br.height / 2, 700);
    await sleep(200);

    btnSearch.classList.add('active');
    await clk(btnSearch);
    await sleep(300);

    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(TARGET);
  }
  </script>
</body>
